<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

                                                                               <!-- Sidebar -->

  <aside class="sidebar">

    <div class="sidebar-header">
      <h2>Admin Page</h2>
      <p>Admin</p>
    </div>

    <button class="nav-btn active"  onclick="switchSection('teachers')">
      <i class="fa-solid fa-chalkboard-user"></i>
      Teachers
    </button>
    
    <button class="nav-btn" onclick="switchSection('students')">
      <i class="fa-solid fa-graduation-cap"></i>
      Students
    </button>
    
    <button class="logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i>
      Logout
    </button>
      </aside>

                                                                               <!-- Main -->

  <main class="main">

    <div class="top-bar">
      <h1 id="pageTitle">Teacher Management</h1>
                                                                               <!-- Add User Button -->
      <button class="add-btn" onclick="openAddModal()">
        ➕ Add User
      </button>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by National ID or Name..."
        onkeyup="renderTable()"
      />
    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
            <th>National ID</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </main>

</div>

                                                                               <!-- Modal -->

<div class="modal-overlay" id="modalOverlay">

  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Add User</h2>

      <button class="close-btn" onclick="closeModal()">
        ×
      </button>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email">
    </div>

    <div class="form-group">
      <label>National ID</label>
      <input type="text" id="nationalId">
    </div>

    <div class="form-group">
      <label>Department</label>
      <input type="text" id="department">
    </div>

    <div class="form-group">
      <label>Position</label>
      <input type="text" id="position">
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" id="address">
    </div>

    <div class="form-group">
      <label>Role</label>

      <select id="role">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
    </div>

    <button class="submit-btn" onclick="saveUser()">
      Save User
    </button>

  </div>

</div>

                                                                               <!-- Delete Confirmation -->
<div class="delete-modal-overlay" id="deleteOverlay">

  <div class="delete-modal">

    <div class="delete-icon">
      🗑
    </div>

    <h2>Confirm Deletion</h2>

    <p id="deleteText">
      Are you sure you want to delete this user?
      <br>
      This action cannot be undone.
    </p>

    <div class="delete-actions">

      <button
        class="cancel-btn"
        onclick="closeDeleteModal()"
      >
        Cancel
      </button>

      <button
        class="confirm-delete-btn"
        onclick="confirmDelete()"
      >
        Delete
      </button>

    </div>

  </div>

</div>



<script>
  let activeSection = "teachers";
  let editingId = null;
  let deleteId = null;
  let teachers = [];
  let students = [];

  function getCurrentData(){
    return activeSection === "teachers" ? teachers : students;
  }

  function renderTable(){

    const tbody = document.getElementById("tableBody");
    const search = document.getElementById("searchInput").value.toLowerCase();

    let data = getCurrentData();

    data = data.filter(user =>
      user.name.toLowerCase().includes(search) ||
      user.nationalId.toLowerCase().includes(search)
    );

    tbody.innerHTML = "";

    if(data.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center;padding:30px;color:#999;">
            No results found.
          </td>
        </tr>
      `;
      return;
    }

    data.forEach(user => {

      tbody.innerHTML += `
        <tr>
          <td>${user.name}</td>

          <td>
            <span class="role-badge">
              ${user.role}
            </span>
          </td>

          <td>${user.department}</td>

          <td>${user.nationalId}</td>

          <td>
            <div class="action-buttons">

              <button class="icon-btn edit-btn" onclick="editUser(${user.id})">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button class="icon-btn delete-btn" onclick="openDeleteModal(${user.id})">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    });
  }



  function switchSection(section){
    activeSection = section;

    document.querySelectorAll(".nav-btn")
      .forEach(btn => btn.classList.remove("active"));

    event.target.classList.add("active");

    document.getElementById("pageTitle").innerText =
      section === "teachers"
      ? "Teacher Management"
      : "Student Management";

    renderTable();
  }

  function openAddModal(){

    editingId = null;

    document.getElementById("modalTitle").innerText = "Add User";

    clearForm();

    document.getElementById("modalOverlay").style.display = "flex";
  }

  function closeModal(){
    document.getElementById("modalOverlay").style.display = "none";
  }

  function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("nationalId").value = "";
    document.getElementById("department").value = "";
    document.getElementById("position").value = "";
    document.getElementById("address").value = "";
    document.getElementById("role").value =
      activeSection === "teachers"
      ? "teacher"
      : "student";
  }

  function saveUser(){

  const user = {
    id: editingId || Date.now(),
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    nationalId: document.getElementById("nationalId").value,
    department: document.getElementById("department").value,
    position: document.getElementById("position").value,
    address: document.getElementById("address").value,
    role: document.getElementById("role").value
  };

  if(!user.name || !user.email || !user.nationalId){
    alert("Please fill required fields");
    return;
  }

                /* EDIT USER */

  if(editingId){

    teachers = teachers.filter(u => u.id !== editingId);
    students = students.filter(u => u.id !== editingId);

    if(user.role === "teacher"){
      teachers.push(user);
    }else{
      students.push(user);
    }

  }

                /* ADD USER */

  else{

    if(user.role === "teacher"){
      teachers.push(user);
    }else{
      students.push(user);
    }

  }

  renderTable();

  closeModal();
}
  function editUser(id){

    let data = getCurrentData();

    const user = data.find(u => u.id === id);

    editingId = id;

    document.getElementById("modalTitle").innerText = "Edit User";

    document.getElementById("name").value = user.name;
    document.getElementById("email").value = user.email;
    document.getElementById("nationalId").value = user.nationalId;
    document.getElementById("department").value = user.department;
    document.getElementById("position").value = user.position;
    document.getElementById("address").value = user.address;
    document.getElementById("role").value = user.role;

    document.getElementById("modalOverlay").style.display = "flex";
  }

  function openDeleteModal(id){

  deleteId = id;

  let data = getCurrentData();

  const user = data.find(u => u.id === id);

  document.getElementById("deleteText").innerHTML =
    `Are you sure you want to delete <strong>${user.name}</strong>?<br>
     This action cannot be undone.`;

  document.getElementById("deleteOverlay").style.display = "flex";
}


  function closeDeleteModal(){

    document.getElementById("deleteOverlay").style.display = "none";
  }

  function confirmDelete(){

    if(activeSection === "teachers"){

      teachers = teachers.filter(u => u.id !== deleteId);

    }else{

      students = students.filter(u => u.id !== deleteId);
    }

    renderTable();

    closeDeleteModal();
  }

  renderTable();

</script>

</body>
</html>
